<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101923">
<title>Pocket Drive 3D</title>
<style>
:root{--lime:#c9f36a;--panel:rgba(10,20,29,.9)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#8ca8ae;color:#fff;font-family:system-ui,Arial,sans-serif;touch-action:none;user-select:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block}.hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:8px;align-items:flex-start;pointer-events:none}.stat{background:#091521b8;border:1px solid #ffffff2b;border-radius:12px;padding:8px 12px;min-width:90px;backdrop-filter:blur(8px)}.stat small{display:block;font-size:9px;letter-spacing:1.5px;color:#c1cbd0}.stat b{font-size:23px}.stat i{font-size:10px;font-style:normal;color:#c1cbd0}.distance{margin-left:auto}.pause{pointer-events:auto;width:42px;height:42px;border:1px solid #ffffff44;border-radius:12px;background:#091521b8;color:white;font-size:19px}.mission{position:absolute;top:82px;left:16px;right:16px;display:flex;justify-content:space-between;font-size:10px;font-weight:800;letter-spacing:1.5px;text-shadow:0 2px 5px #000}.controls{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:0;right:0;padding:0 16px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}.group{display:flex;gap:9px;pointer-events:auto}.control{touch-action:none;border:1px solid #ffffff55;background:#0a1828bd;color:white;border-radius:18px;width:62px;height:62px;font-weight:900;box-shadow:0 5px 18px #0004}.control.gas{background:#c9f36a;color:#1c290e;border-color:#efffb7;height:70px}.control.brake{height:66px}.control.active{filter:brightness(1.25);transform:scale(.96)}.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:22px;background:linear-gradient(#07121a25,#07121a9c)}.hide{display:none!important}.panel{width:min(90vw,390px);background:var(--panel);border:1px solid #ffffff2b;border-radius:25px;padding:28px 25px;box-shadow:0 20px 70px #0007;backdrop-filter:blur(16px)}.logo{width:42px;height:42px;border-radius:13px;background:var(--lime);color:#1b280e;display:grid;place-items:center;font-weight:1000}.eyebrow{color:var(--lime);font-size:10px;font-weight:900;letter-spacing:3px;margin:18px 0 8px}h1{font-size:clamp(44px,12vw,64px);line-height:.82;letter-spacing:-3px;margin:0;font-weight:1000}h1 em{color:var(--lime);font-style:normal}.intro{color:#bdc9d0;font-size:13px;line-height:1.5;margin:18px 0 22px}.primary,.secondary{height:51px;width:100%;border:0;border-radius:13px;font-weight:950;letter-spacing:1px}.primary{background:var(--lime);color:#19250d}.secondary{margin-top:10px;background:#ffffff16;color:white;border:1px solid #ffffff2a}.hint{text-align:center;color:#9cabb4;font-size:10px;margin:14px 0 0}.center{text-align:center}.center .eyebrow{margin-top:0}h2{margin:8px 0 22px;font-size:32px}.result{color:#bdc9d0}.result b{color:var(--lime);font-size:22px}#error{position:absolute;left:12px;right:12px;top:50%;transform:translateY(-50%);padding:12px;background:#4b1717e8;border-radius:10px;text-align:center;font-size:12px;display:none}@media(orientation:landscape){.controls{padding:0 28px 8px}.control{width:57px;height:57px}.mission{top:68px}} 
</style>
</head>
<body>
<canvas id="game"></canvas>
<header class="hud">
 <div class="stat"><small>SPEED</small><b id="speed">0</b><i> km/h</i></div>
 <div class="stat distance"><small>DISTANCE</small><b id="distance">0</b><i> m</i></div>
 <button class="pause" id="pause" aria-label="Pause">Ⅱ</button>
</header>
<div class="mission"><span id="mission">CITY DRIVE</span><span>POCKET DRIVE</span></div>
<nav class="controls">
 <div class="group"><button class="control" data-key="left">◀</button><button class="control" data-key="right">▶</button></div>
 <div class="group"><button class="control brake" data-key="brake">BRAKE</button><button class="control gas" data-key="gas">GAS ▲</button></div>
</nav>
<section class="overlay" id="menu"><div class="panel"><div class="logo">PD</div><p class="eyebrow">3D CITY DRIVER</p><h1>POCKET<br><em>DRIVE</em></h1><p class="intro">Get behind the wheel. Follow the road. Drive through the city.</p><button class="primary" id="start">START DRIVING</button><p class="hint">Mobile touch controls · 3D driving</p></div></section>
<section class="overlay hide" id="paused"><div class="panel center"><p class="eyebrow">TAKE A BREAK</p><h2>PAUSED</h2><button class="primary" id="resume">RESUME</button><button class="secondary" id="restart1">RESTART</button></div></section>
<section class="overlay hide" id="crashed"><div class="panel center"><p class="eyebrow">TRIP ENDED</p><h2>DRIVE COMPLETE</h2><p class="result">Distance <b id="final">0 m</b></p><button class="primary" id="retry">DRIVE AGAIN</button></div></section>
<div id="error"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js" onerror="window.THREE_LOAD_FAILED=true"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ui={menu:$('menu'),paused:$('paused'),crashed:$('crashed'),speed:$('speed'),distance:$('distance'),final:$('final'),mission:$('mission')};
const held={left:false,right:false,gas:false,brake:false};let state='menu',speed=0,travel=0,steer=0,heading=0,yawRate=0,hitCooldown=0,last=performance.now(),fallback=false;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function bindControls(){document.querySelectorAll('[data-key]').forEach(btn=>{const k=btn.dataset.key;const down=e=>{e.preventDefault();held[k]=true;btn.classList.add('active');try{btn.setPointerCapture(e.pointerId)}catch(_){}};const up=e=>{e.preventDefault();held[k]=false;btn.classList.remove('active')};btn.addEventListener('pointerdown',down);['pointerup','pointercancel','lostpointercapture'].forEach(n=>btn.addEventListener(n,up))});const map={ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right',ArrowUp:'gas',' ':'gas',ArrowDown:'brake',s:'brake'};addEventListener('keydown',e=>{if(map[e.key]){held[map[e.key]]=true;e.preventDefault()}if(e.key==='Escape')state==='playing'?pause():resume()});addEventListener('keyup',e=>{if(map[e.key])held[map[e.key]]=false})}
function show(which){ui.menu.classList.toggle('hide',which!=='menu');ui.paused.classList.toggle('hide',which!=='paused');ui.crashed.classList.toggle('hide',which!=='crashed')}
function reset(){speed=0;travel=0;steer=0;heading=0;yawRate=0;hitCooldown=0;Object.keys(held).forEach(k=>held[k]=false);$('speed').textContent='0';$('distance').textContent='0'}
function start(){reset();state='playing';show('none')}
function pause(){if(state!=='playing')return;state='paused';Object.keys(held).forEach(k=>held[k]=false);show('paused')}
function resume(){if(state!=='paused')return;state='playing';show('none')}
function finish(){state='crashed';speed=0;$('final').textContent=Math.floor(travel)+' m';show('crashed');if(navigator.vibrate)navigator.vibrate(90)}
$('start').onclick=start;$('retry').onclick=start;$('restart1').onclick=start;$('pause').onclick=pause;$('resume').onclick=resume;bindControls();
if(window.THREE && !window.THREE_LOAD_FAILED){try{runThree()}catch(e){console.error(e);runCanvas()}}else{runCanvas()}
function runThree(){
 const T=THREE,scene=new T.Scene();scene.background=new T.Color(0x9bb9c4);scene.fog=new T.Fog(0x9bb9c4,65,230);
 const camera=new T.PerspectiveCamera(66,innerWidth/innerHeight,.1,400);camera.position.set(0,5.3,11);
 const renderer=new T.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;
 scene.add(new T.HemisphereLight(0xe4f2ff,0x59634b,2));const sun=new T.DirectionalLight(0xffedcf,2.2);sun.position.set(-18,28,15);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
 const material=(c,r=.8,m=0)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:m});
 const roadMat=material(0x343a3d),sideMat=material(0xb7b3a6),grassMat=material(0x627c55),dashMat=material(0xe7e3d6),glassMat=material(0x263e4b,.3,.1),tireMat=material(0x15191c),chromeMat=material(0x929da0,.25,.6);
 const world=new T.Group();scene.add(world);
 function cube(parent,w,h,d,mat,x,y,z){const o=new T.Mesh(new T.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
 cube(world,13,.12,260,roadMat,0,-.12,-100);for(const x of [-7.1,7.1])cube(world,1,.18,260,sideMat,x,-.08,-100);for(const x of [-2.17,2.17])for(let z=35;z>-225;z-=12)cube(world,.12,.018,4.5,dashMat,x,-.045,z);for(const x of [-9.5,9.5])cube(world,4,.08,260,grassMat,x,-.2,-100);
 const buildingColors=[0x9c9b91,0xb9aa91,0x7f8d8b,0xc2b8a4,0x87939b,0xa88f7d];
 for(let i=0;i<30;i++){const z=25-i*8.5,s=i%2?1:-1,w=4+(i%3)*1.3,h=5+(i%5)*2.1,x=s*(12+(i%3)*1.8);cube(world,w,h,5,material(buildingColors[i%6]),x,h/2-.08,z);for(let y=1;y<h-1;y+=1.6)for(let xx=-w/2+.6;xx<w/2-.3;xx+=1.25)cube(world,.48,.62,.04,material(0x718e99,.3),x+xx,y,z+2.53)}
 for(let z=25;z>-220;z-=18)for(const x of [-8.2,8.2]){cube(world,.2,1.5,.2,material(0x604b35),x,.7,z);const crown=new T.Mesh(new T.SphereGeometry(.9,8,7),material(0x47734a));crown.position.set(x,2,z);crown.castShadow=true;world.add(crown)}
 function car(color){const root=new T.Group(),body=material(color,.35,.2);cube(root,1.75,.48,3.35,body,0,.62,0);cube(root,1.45,.55,1.7,body,0,1.08,-.25);cube(root,1.31,.46,1.46,glassMat,0,1.12,-.28);for(const x of [-.88,.88])for(const z of [-1.05,1.05]){const wheel=new T.Mesh(new T.CylinderGeometry(.37,.37,.22,16),tireMat);wheel.rotation.z=Math.PI/2;wheel.position.set(x,.4,z);root.add(wheel);const hub=new T.Mesh(new T.CylinderGeometry(.15,.15,.23,12),chromeMat);hub.rotation.z=Math.PI/2;hub.position.copy(wheel.position);root.add(hub)}for(const x of [-.58,.58]){cube(root,.28,.13,.06,material(0xfff0c4),x,.68,-1.7);cube(root,.25,.12,.06,material(0xc13d32),x,.68,1.7)}return root}
 const player=car(0xc9f36a);player.position.set(0,0,4);scene.add(player);
 const traffic=[],trafficColors=[0xe5e1d6,0x507f9c,0xb94e40,0xd1a34b,0x66737b];
 for(let i=0;i<7;i++){const lane=Math.floor(Math.random()*3),v=car(trafficColors[i%5]);v.scale.setScalar(.92);v.position.set((lane-1)*3.8,0,-28-i*27);scene.add(v);traffic.push({mesh:v,z:v.position.z,lane,v:7+Math.random()*5})}
 function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5))}
 addEventListener('resize',resize);
 function frame(now){const dt=Math.min(now-last,50);last=now;if(state==='playing'){
 const dtSec=dt/1000,absSpeed=Math.abs(speed);
 // Longitudinal dynamics in metres/second: engine, braking, rolling resistance.
 const throttle=held.gas?1:0,braking=held.brake?1:0;
 if(throttle){
  if(speed<-.15) speed+=7.0*dtSec;
  else speed+=4.1*dtSec;
 }else if(braking){
  if(speed>.15) speed-=8.5*dtSec;
  else speed-=2.2*dtSec;
 }else{
  const drag=0.34+0.012*speed*speed;
  if(absSpeed>0.025) speed-=Math.sign(speed)*drag*dtSec;
  else speed=0;
 }
 speed=clamp(speed,-5.5,23.5);
 // Front-wheel steering and a kinematic bicycle model.
 const steerInput=(held.left?1:0)-(held.right?1:0);
 const steerTarget=steerInput*0.27;
 steer+=(steerTarget-steer)*(1-Math.exp(-3.4*dtSec));
 const wheelbase=2.65;
 const speedSteerFactor=1-Math.min(0.22,absSpeed/110);
 const targetYawRate=(speed/wheelbase)*Math.tan(steer)*speedSteerFactor*0.82;
 yawRate+=(targetYawRate-yawRate)*(1-Math.exp(-5.2*dtSec));
 heading+=yawRate*dtSec;
 // The car points down -Z. Positive heading turns it toward screen-left.
 player.position.x-=Math.sin(heading)*speed*dtSec;
 player.rotation.y=heading;
 // Mild body roll, proportional to cornering force, not steering-button position.
 const lateralAccel=Math.abs(speed*yawRate);
 player.rotation.z=clamp(-Math.sign(yawRate)*Math.min(.055,lateralAccel*.004),-.055,.055);
 // Road edge has grip and rolling resistance; no teleporting sideways.
 if(Math.abs(player.position.x)>4.35){
  speed*=Math.max(0,1-1.8*dtSec);
  heading*=Math.max(0,1-.7*dtSec);
 }
 player.position.x=clamp(player.position.x,-5.25,5.25);
 const move=speed*dtSec;
 travel+=absSpeed*dtSec;
 world.position.z+=move;
 if(world.position.z>160)world.position.z-=260;
 if(world.position.z< -100)world.position.z+=260;
 hitCooldown=Math.max(0,hitCooldown-dtSec);
 for(const c of traffic){
  c.z+=move-c.v*dtSec;
  if(c.z>14){c.z=-190-Math.random()*25;c.lane=Math.floor(Math.random()*3);c.mesh.position.x=(c.lane-1)*3.8;c.v=7+Math.random()*5}
  if(c.z< -225)c.z=-190-Math.random()*25;
  c.mesh.position.z=c.z;
  if(hitCooldown<=0&&Math.abs(c.z-player.position.z)<2.5&&Math.abs(c.mesh.position.x-player.position.x)<1.55&&absSpeed>2){
   speed*=.28;
   yawRate+=(player.position.x<c.mesh.position.x?-.22:.22);
   c.z=-165-Math.random()*25;hitCooldown=1.0;
   if(navigator.vibrate)navigator.vibrate(65);
  }
 }
 camera.position.x+=(player.position.x*.35-camera.position.x)*(1-Math.exp(-2.5*dtSec));
 camera.position.y=5.1+absSpeed*.025;
 camera.position.z=10.8+absSpeed*.035;
 camera.lookAt(player.position.x*.18,1,-10);
 ui.speed.textContent=Math.round(absSpeed*3.6);
 ui.distance.textContent=Math.floor(travel);
 ui.mission.textContent=Math.abs(player.position.x)>4.1?'SLOW DOWN · ROAD EDGE':absSpeed>19?'WATCH YOUR SPEED':absSpeed>11?'KEEP YOUR DISTANCE':'CITY DRIVE';
}
 renderer.render(scene,camera);requestAnimationFrame(frame)}
 renderer.render(scene,camera);requestAnimationFrame(frame)
}
function runCanvas(){
 fallback=true;const ctx=canvas.getContext('2d');function resize(){canvas.width=innerWidth;canvas.height=innerHeight}resize();addEventListener('resize',resize);let scroll=0,cars=[{lane:-1,z:.15},{lane:1,z:.5},{lane:0,z:.78}];
 function frame(now){const dt=Math.min(now-last,50);last=now;if(state==='playing'){speed=clamp(speed+((held.gas?22:0)-(held.brake?45:0)-(held.gas?1:5))*dt/1000,0,120);const target=(held.left?-1:0)+(held.right?1:0);steer+=(target-steer)*.18;travel+=speed*dt/3600;scroll+=speed*dt*.025;cars.forEach(c=>{c.z+=(speed/2200+.00004)*dt;if(c.z>1.1){c.z=-.15;c.lane=Math.floor(Math.random()*3)-1}if(c.z>.77&&c.z<.9&&Math.abs(c.lane*.55+steer*.2)<.22&&speed>25)finish()});ui.speed.textContent=Math.round(speed);ui.distance.textContent=Math.floor(travel)}
 const w=canvas.width,h=canvas.height,hor=h*.36;ctx.fillStyle='#94b8c4';ctx.fillRect(0,0,w,hor);ctx.fillStyle='#6c875c';ctx.fillRect(0,hor,w,h-hor);ctx.fillStyle='#343a3d';ctx.beginPath();ctx.moveTo(w*.43,hor);ctx.lineTo(w*.57,hor);ctx.lineTo(w*.96,h);ctx.lineTo(w*.04,h);ctx.fill();
 for(let i=0;i<12;i++){const z=((i/12+scroll*.0007)%1),y=hor+z*(h-hor),half=w*(.07+.41*z);ctx.fillStyle='#eee9d9';ctx.fillRect(w/2-half,y,Math.max(2,4*z),Math.max(2,18*z));ctx.fillRect(w/2+half-4*z,y,Math.max(2,4*z),Math.max(2,18*z))}
 cars.forEach(c=>{const y=hor+c.z*(h-hor),x=w/2+c.lane*w*.14*c.z,ww=12+42*c.z,hh=ww*1.5;ctx.fillStyle='#222';ctx.fillRect(x-ww/2,y-hh/2,ww,hh);ctx.fillStyle='#5d8190';ctx.fillRect(x-ww*.32,y-hh*.35,ww*.64,hh*.25)});
 const px=w/2+steer*w*.25,py=h*.82,pw=Math.min(w*.17,72),ph=pw*1.5;ctx.fillStyle='#14191c';ctx.fillRect(px-pw*.55,py-ph*.2,pw*1.1,ph*.8);ctx.fillStyle='#c9f36a';ctx.fillRect(px-pw*.45,py-ph*.45,pw*.9,ph*.8);ctx.fillStyle='#304753';ctx.fillRect(px-pw*.32,py-ph*.4,pw*.64,ph*.25);
 requestAnimationFrame(frame)}requestAnimationFrame(frame)
}
})();
</script>
</body>

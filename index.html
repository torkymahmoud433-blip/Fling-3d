<script>
(()=>{
const canvas=document.getElementById('gl'),gl=canvas.getContext('webgl',{antialias:true,alpha:false})||canvas.getContext('experimental-webgl');
if(!gl){document.getElementById('status').textContent='WebGL غير مدعوم';return}
const vs=`attribute vec3 p; attribute vec3 c; uniform mat4 mvp; varying vec3 v; void main(){v=c;gl_Position=mvp*vec4(p,1.);}`;
const fs=`precision mediump float; varying vec3 v; void main(){gl_FragColor=vec4(v,1.);}`;
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(s);return s}
let prog=gl.createProgram();gl.attachShader(prog,shader(gl.VERTEX_SHADER,vs));gl.attachShader(prog,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(prog);gl.useProgram(prog);
const locP=gl.getAttribLocation(prog,'p'),locC=gl.getAttribLocation(prog,'c'),locM=gl.getUniformLocation(prog,'mvp');
const skyVS=`attribute vec2 aPos; varying vec2 vUv; void main(){vUv=aPos*.5+.5;gl_Position=vec4(aPos,0.999,1.0);}`;
const skyFS=`precision mediump float; varying vec2 vUv; uniform float uTime; uniform vec2 uResolution;
float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.0-2.0*f);return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=noise(p)*a;p*=2.03;a*=.5;}return v;}
void main(){vec2 uv=vUv;float horizon=smoothstep(0.0,1.0,uv.y);vec3 low=vec3(.88,.68,.48);vec3 mid=vec3(.27,.61,.82);vec3 high=vec3(.035,.16,.34);vec3 sky=mix(low,mid,smoothstep(.02,.52,horizon));sky=mix(sky,high,smoothstep(.48,1.0,horizon));vec2 p=vec2(uv.x*3.0,uv.y*1.6+uTime*.012);float clouds=fbm(p*3.0+vec2(uTime*.008,0.));float mask=smoothstep(.52,.78,clouds)*smoothstep(.18,.82,uv.y);vec3 cloud=mix(vec3(.66,.79,.88),vec3(1.0),clouds);sky=mix(sky,cloud,mask*.48);float glow=pow(max(0.,1.0-length((uv-vec2(.78,.28))*vec2(1.2,1.8))),5.);sky+=vec3(1.,.55,.25)*glow*.28;gl_FragColor=vec4(sky,1.);}`;
const skyProg=gl.createProgram();gl.attachShader(skyProg,shader(gl.VERTEX_SHADER,skyVS));gl.attachShader(skyProg,shader(gl.FRAGMENT_SHADER,skyFS));gl.linkProgram(skyProg);
if(!gl.getProgramParameter(skyProg,gl.LINK_STATUS))throw gl.getProgramInfoLog(skyProg);
const skyPos=gl.getAttribLocation(skyProg,'aPos'),skyTime=gl.getUniformLocation(skyProg,'uTime'),skyRes=gl.getUniformLocation(skyProg,'uResolution');
const skyBuffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,skyBuffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);

let verts=[],cols=[];
function tri(a,b,c,col){for(let v of [a,b,c]){verts.push(...v);cols.push(...col)}}
function quad(a,b,c,d,col){tri(a,b,c,col);tri(a,c,d,col)}
function cube(cx,cy,cz,sx,sy,sz,col){let x=cx,y=cy,z=cz,X=x+sx,Y=y+sy,Z=z+sz;let a=[x,y,z],b=[X,y,z],c=[X,Y,z],d=[x,Y,z],e=[x,y,Z],f=[X,y,Z],g=[X,Y,Z],h=[x,Y,Z];quad(a,b,c,d,col);quad(e,h,g,f,col);quad(a,e,f,b,col);quad(d,c,g,h,col);quad(a,d,h,e,col);quad(b,f,g,c,col)}
// Smooth procedural aircraft models: elliptical fuselage, swept wings, canopy and engines
const aircraftStyles=[
 {name:'الطائرة الأساسية',body:[.88,.91,.94],wing:[.08,.48,.78],accent:[.88,.12,.13],glass:[.08,.36,.53],engine:[.18,.24,.30],span:2.15,sweep:.28,engines:1},
 {name:'المقاتلة الخفيفة',body:[.10,.43,.78],wing:[.08,.68,.94],accent:[.94,.18,.24],glass:[.06,.24,.43],engine:[.24,.31,.38],span:2.35,sweep:.42,engines:1},
 {name:'طائرة النقل',body:[.91,.62,.12],wing:[.98,.70,.18],accent:[.98,.87,.46],glass:[.14,.32,.40],engine:[.28,.30,.28],span:2.55,sweep:.12,engines:2},
 {name:'المقاتلة النفاثة',body:[.78,.12,.16],wing:[.91,.16,.19],accent:[1,.48,.35],glass:[.08,.25,.40],engine:[.20,.22,.28],span:2.05,sweep:.58,engines:2},
 {name:'الطائرة الفضائية',body:[.72,.85,.96],wing:[.10,.66,.91],accent:[.18,.94,1],glass:[.10,.38,.60],engine:[.10,.65,.90],span:2.2,sweep:.48,engines:2},
 {name:'الأسطورية',body:[.16,.20,.29],wing:[.96,.36,.08],accent:[1,.58,.12],glass:[.04,.23,.35],engine:[.95,.32,.08],span:2.45,sweep:.66,engines:2}
];
let aircraftStyle=0,aircraft={v:new Float32Array(0),c:new Float32Array(0)};
function ellipsoid(cx,cy,cz,rx,ry,rz,col,steps=12,rings=8){
 for(let j=0;j<rings;j++){let p1=-Math.PI/2+j/rings*Math.PI,p2=-Math.PI/2+(j+1)/rings*Math.PI;
  for(let i=0;i<steps;i++){let a=i/steps*Math.PI*2,b=(i+1)/steps*Math.PI*2;
   const pt=(p,t)=>[cx+rx*Math.cos(p)*Math.cos(t),cy+ry*Math.sin(p),cz+rz*Math.cos(p)*Math.sin(t)];
   let a1=pt(p1,a),b1=pt(p1,b),a2=pt(p2,a),b2=pt(p2,b);tri(a1,a2,b2,col);tri(a1,b2,b1,col);
  }
 }
}
function wing(poly,yTop,yBot,col){
 let center=poly.reduce((o,p)=>[o[0]+p[0]/poly.length,o[1]+p[1]/poly.length],[0,0]);
 for(let i=0;i<poly.length;i++){let a=poly[i],b=poly[(i+1)%poly.length];
  tri([center[0],yTop,center[1]],[a[0],yTop,a[1]],[b[0],yTop,b[1]],col);
  tri([center[0],yBot,center[1]],[b[0],yBot,b[1]],[a[0],yBot,a[1]],col);
  quad([a[0],yBot,a[1]],[b[0],yBot,b[1]],[b[0],yTop,b[1]],[a[0],yTop,a[1]],[Math.max(0,col[0]*.72),Math.max(0,col[1]*.72),Math.max(0,col[2]*.72)]);
 }
}
function buildAircraft(index){
 verts.length=0;cols.length=0;let st=aircraftStyles[index],body=st.body;
 // جسم الطائرة من حلقات بيضاوية متدرجة ليعطي مقدمة مدببة ومؤخرة عريضة
 const sections=[[-1.72,.035,.045],[-1.48,.105,.12],[-1.05,.17,.17],[-.45,.20,.19],[.35,.18,.17],[.95,.13,.13],[1.42,.07,.08],[1.58,.025,.035]];
 for(let k=0;k<sections.length-1;k++){let A=sections[k],B=sections[k+1];
  for(let i=0;i<16;i++){let a=i/16*Math.PI*2,b=(i+1)/16*Math.PI*2;
   let pt=(q,t)=>[Math.cos(t)*q[1],.02+Math.sin(t)*q[2],q[0]];
   let p1=pt(A,a),p2=pt(A,b),p3=pt(B,b),p4=pt(B,a);quad(p1,p2,p3,p4,body);
  }
 }
 // أجنحة رئيسية ذات حواف مائلة
 let sw=st.sweep;
 wing([[-.17,-.72],[.17,-.72],[st.span,-.28],[st.span*.92,.12],[.62,.08],[-.55,.22],[-st.span*.92,.12],[-st.span,-.28]],.035,-.035,st.wing);
 // ذيل أفقي ورأس ذيل رأسي
 wing([[-.12,1.02],[.12,1.02],[.86,1.36],[.72,1.53],[-.72,1.53],[-.86,1.36]],.08,.015,st.accent);
 wing([[-.10,1.20],[.10,1.20],[.34,1.56],[.20,1.62],[-.20,1.62],[-.34,1.56]],.30,-.02,st.accent);
 // قمرة قيادة زجاجية بارزة
 ellipsoid(0,.185,-.67,.145,.105,.48,st.glass,14,8);
 ellipsoid(0,.205,-.79,.115,.055,.22,[.35,.72,.91],12,6);
 // محركات انسيابية أسفل الجناحين مع حلقات أمامية مضيئة
 for(let e=0;e<st.engines;e++){let x=st.engines===1?0:(e===0?-.92:.92);
  if(st.engines===1)x=0;
  ellipsoid(x,-.105,-.12,.19,.17,.60,st.engine,12,8);
  ellipsoid(x,-.105,-.64,.145,.13,.075,st.accent,12,6);
  ellipsoid(x,-.105,-.70,.095,.09,.025,[.06,.12,.18],12,6);
 }
 // خطوط لونية رفيعة أعلى جسم الطائرة
 ellipsoid(0,.095,-.05,.045,.035,1.18,st.accent,10,6);
 aircraft.v=new Float32Array(verts);aircraft.c=new Float32Array(cols);
 gl.bindBuffer(gl.ARRAY_BUFFER,avb);gl.bufferData(gl.ARRAY_BUFFER,aircraft.v,gl.STATIC_DRAW);
 gl.bindBuffer(gl.ARRAY_BUFFER,acb);gl.bufferData(gl.ARRAY_BUFFER,aircraft.c,gl.STATIC_DRAW);
}

function buffer(data,loc){let b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,loc===locP?3:3,gl.FLOAT,false,0,0);return b}
buffer(aircraft.v,locP);buffer(aircraft.c,locC);
function matMul(a,b){let o=new Float32Array(16);for(let r=0;r<4;r++)for(let c=0;c<4;c++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o}
function perspective(fov,asp,n,f){let t=1/Math.tan(fov/2);return new Float32Array([t/asp,0,0,0,0,t,0,0,0,0,(f+n)/(n-f),-1,0,0,2*f*n/(n-f),0])}
function look(eye,center,up){let norm=v=>{let l=Math.hypot(...v)||1;return v.map(x=>x/l)},sub=(a,b)=>a.map((x,i)=>x-b[i]),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];let z=norm(sub(eye,center)),x=norm(cross(up,z)),y=cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-x.reduce((s,v,i)=>s+v*eye[i],0),-y.reduce((s,v,i)=>s+v*eye[i],0),-z.reduce((s,v,i)=>s+v*eye[i],0),1])}
let worldV=[],worldC=[];function wtri(a,b,c,col){for(let v of [a,b,c]){worldV.push(v[0]*1.5,v[1],v[2]*3.2);worldC.push(...col)}}
function island(x,z,r,h){let n=9,ring=[];for(let i=0;i<n;i++){let a=i/n*Math.PI*2,rr=r*(.72+Math.random()*.45);ring.push([x+Math.cos(a)*rr,0,z+Math.sin(a)*rr])}for(let i=0;i<n;i++){let a=ring[i],b=ring[(i+1)%n],peak=[x,h,z];wtri(a,b,peak,[.18,.48,.28]);wtri([a[0],-.1,a[2]],[b[0],-.1,b[2]],[b[0],0,b[2]],[.24,.32,.25])}wtri([x-r*.5,h*.65,z],[x+r*.5,h*.65,z],[x,h*1.35,z],[.72,.76,.78])}

// عالم ممتد مقسّم إلى سهول خضراء ثم جبال ثم مدينة وصحراء
function boxWorld(x,y,z,w,h,d,col){
 let a=[x,y,z],b=[x+w,y,z],cc=[x+w,y+h,z],dd=[x,y+h,z],
 e=[x,y,z+d],ff=[x+w,y,z+d],g=[x+w,y+h,z+d],hh=[x,y+h,z+d];
 wtri(a,b,cc,col);wtri(a,cc,dd,col);wtri(e,hh,g,col);wtri(e,g,ff,col);
 wtri(a,e,ff,col);wtri(a,ff,b,col);wtri(dd,cc,g,col);wtri(dd,g,hh,col);
 wtri(a,dd,hh,col);wtri(a,hh,e,col);wtri(b,ff,g,col);wtri(b,g,cc,col);
}
function coneWorld(x,y,z,r,h,col){
 let n=7;for(let i=0;i<n;i++){let a=i/n*Math.PI*2,b=(i+1)/n*Math.PI*2;
 wtri([x+Math.cos(a)*r,y,z+Math.sin(a)*r],[x+Math.cos(b)*r,y,z+Math.sin(b)*r],[x,y+h,z],col)}
}
function hill(x,z,r,h,col){
 let n=10;for(let i=0;i<n;i++){let a=i/n*Math.PI*2,b=(i+1)/n*Math.PI*2;
 wtri([x+Math.cos(a)*r, -2.8,z+Math.sin(a)*r],[x+Math.cos(b)*r,-2.8,z+Math.sin(b)*r],[x,h,z],col)}
}
// أرض متصلة تحت مسار الطائرة
for(let iz=0;iz<95;iz++)for(let ix=0;ix<40;ix++){
 let z=30-iz*5,x=-100+ix*5;
 let biome=iz<28?0:iz<55?1:iz<77?2:3;
 let y=-3+Math.sin(ix*.31+iz*.17)*.22+Math.cos(iz*.22)*.18;
 let col=biome===0?[.22,.48,.20]:biome===1?[.42,.39,.28]:biome===2?[.30,.38,.34]:[.68,.52,.29];
 let a=[x,y,z],b=[x+5,y,z],cc=[x+5,y,z-5],d=[x,y,z-5];
 wtri(a,b,cc,col);wtri(a,cc,d,col);
}
// تلال بعيدة على الأفق
for(let i=0;i<42;i++){let z=20-i*6;hill(-47,z,13,2+Math.random()*7,[.28,.39,.31]);hill(48,z-3,15,3+Math.random()*9,[.31,.42,.34]);}
// أشجار على أطراف السهول
for(let i=0;i<65;i++){let z=24-Math.random()*105,x=(Math.random()<.5?-1:1)*(18+Math.random()*38),h=2.2+Math.random()*2;
 boxWorld(x-.22,-2.7,z,.44,h*.55,.44,[.28,.18,.10]);
 coneWorld(x,-2.0+h*.25,z,1.1,h,[.12,.35,.16]);
 coneWorld(x,-1.3+h*.35,z,.78,h*.72,[.16,.42,.19]);
}
// جبال صخرية في المنطقة الثانية
for(let i=0;i<18;i++){let z=-85-Math.random()*105,x=(Math.random()<.5?-1:1)*(17+Math.random()*34);
 hill(x,z,5+Math.random()*7,5+Math.random()*12,[.43,.43,.40]);}
// مبانٍ في منطقة المدينة
for(let i=0;i<34;i++){let z=-185-Math.random()*65,x=(Math.random()<.5?-1:1)*(15+Math.random()*38),w=3+Math.random()*5,h=5+Math.random()*19;
 boxWorld(x,-2.8,z,w,h,4+Math.random()*5,[.30+Math.random()*.12,.38+Math.random()*.14,.48+Math.random()*.16]);
 // شرائط نوافذ مضيئة على الواجهة
 for(let k=0;k<Math.min(6,Math.floor(h/3));k++)boxWorld(x+.2,-1.8+k*2.7,z-.03,w-.4,.13,.08,[.78,.78,.49]);
}
// صخور وتكوينات رملية في نهاية المسار
for(let i=0;i<22;i++){let z=-255-Math.random()*65,x=(Math.random()<.5?-1:1)*(16+Math.random()*40);
 hill(x,z,4+Math.random()*8,2+Math.random()*6,[.67,.48,.27]);}

const wvb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,wvb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(worldV),gl.STATIC_DRAW);
const wcb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,wcb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(worldC),gl.STATIC_DRAW);
const avb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,avb);gl.bufferData(gl.ARRAY_BUFFER,aircraft.v,gl.STATIC_DRAW);
const acb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,acb);gl.bufferData(gl.ARRAY_BUFFER,aircraft.c,gl.STATIC_DRAW);
buildAircraft(0);
const planeChoice=document.getElementById("planeChoice");
planeChoice.addEventListener("change",()=>{aircraftStyle=Number(planeChoice.value);buildAircraft(aircraftStyle)});
let state={x:0,y:4,z:0,yaw:0,pitch:0,roll:0,speed:0,power:0,started:false};

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
const layer=document.createElement('canvas');layer.id='glbLayer';document.body.insertBefore(layer,document.getElementById('hud'));
const renderer=new THREE.WebGLRenderer({canvas:layer,alpha:true,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.25));renderer.setSize(innerWidth,innerHeight,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(57.2958,innerWidth/innerHeight,.1,1700);
scene.add(new THREE.HemisphereLight(0xd9f1ff,0x26313b,2.0));
const sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(-5,9,7);scene.add(sun);
const loader=new GLTFLoader();let active=null,loadToken=0;
const modelFiles=['A320.glb','A320_nologo.glb','A350.glb','A350_nologo.glb','A380.glb','A380_nologo.glb','B737.glb','B737_nologo.glb','B787.glb','B787_nologo.glb','EVTOL.glb','EVTOL_nologo.glb','drone.glb','drone_nologo.glb'];
function setPlane(index){
 const token=++loadToken;
 const url='https://raw.githubusercontent.com/torkymahmoud433-blip/Fling-3d/main/'+modelFiles[index];
 document.getElementById('status').textContent='تحميل الطائرة 3D...';
 loader.load(url,g=>{
  if(token!==loadToken)return;
  if(active)scene.remove(active);
  const model=new THREE.Group();
  const meshRoot=g.scene;
  const box=new THREE.Box3().setFromObject(meshRoot),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3());
  meshRoot.position.sub(center);
  // خلي تصحيح الاتجاه على الموديل الداخلي عشان ما يتمسحش مع حركة الطائرة.
  meshRoot.rotation.y=Math.PI;
  meshRoot.traverse(o=>{if(o.isMesh){o.frustumCulled=true;o.castShadow=false;o.receiveShadow=false;}});
  model.add(meshRoot);
  const maxDim=Math.max(size.x,size.y,size.z)||1;
